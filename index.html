<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f2">
<title>Bené — Grafismo Fonético</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bené">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3426;--ink2:#7a6657;--sky:#7ec8f2;--sky2:#e6f5fe;--sun:#ffc94a;--coral:#f26b6b;--blue:#5ba8e8;--green:#5fa84f;--cream:#fff7ea;--line:#eadfce;--white:#fff;
  --display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;--body:"Nunito",ui-rounded,system-ui,sans-serif;--nav:72px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-weight:600;color:var(--ink);background:var(--cream);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.1}
p{margin:0}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--cream)}

/* cabeçalho */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--cream);border-bottom:2px solid var(--line)}
.top img{height:40px}
.top h1{flex:1;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);background:var(--white);font-family:var(--display);font-size:20px;flex:none}
.icon svg{width:22px;height:22px}
main{flex:1;padding:18px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
main.full{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

/* navegação */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--white);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:800;color:var(--ink2)}
nav svg{width:26px;height:26px}
nav button[aria-current=page]{color:var(--ink)}
nav button[aria-current=page] span{background:var(--sun)}
nav button span{display:grid;place-items:center;width:56px;height:32px;border-radius:16px}

/* blocos */
.card{background:var(--white);border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink)}
.pad{padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:26px;border:2px solid var(--ink);background:var(--sun);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--white)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.sec{font-size:20px;margin-top:6px}
.muted{color:var(--ink2);font-size:14.5px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1;min-width:0}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--green)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.item .badge{width:56px;height:56px;border-radius:16px;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;flex:none}
.item img.th{width:56px;height:56px;object-fit:contain;flex:none}
.item h3{font-size:19px}
.chev{width:20px;height:20px;flex:none;color:var(--ink2)}
.hero{display:flex;align-items:center;gap:12px;padding:16px;background:var(--sky2)}
.hero img{width:92px;flex:none}
.hero h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;aspect-ratio:1/1.12;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0;border-radius:16px;box-shadow:0 3px 0 var(--ink)}
.tile img{width:100%;flex:1;min-height:0;object-fit:contain}
.tile b{font-family:var(--display);font-size:14px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.done{background:#e9f6e2}
.tile .ok{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--green);border:2px solid var(--ink);display:grid;place-items:center}
.tile .ok svg{width:14px;height:14px;color:#fff}
.tile.letter{aspect-ratio:1;justify-content:center;font-family:var(--display);font-size:38px}

/* atividade */
.stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px}
.stage img{width:150px;height:150px;object-fit:contain}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{min-width:62px;padding:6px 14px;border-radius:14px;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-size:30px;line-height:1.1;color:#fff}
.chip.pop{animation:pop .3s}
.chip.empty{background:var(--white);color:transparent;border-style:dashed;box-shadow:none}
.chip.no{animation:shake .3s}
.hint{font-size:15px;color:var(--ink2);text-align:center}
.trace{padding:6px;background:var(--white);touch-action:none}
.trace canvas,.paint canvas{display:block;width:100%;touch-action:none}
.paint{position:relative;overflow:hidden;padding:0}
.paint img{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
.pal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pal button{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink)}
.pal button.sel{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.win{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;background:#e9f6e2;text-align:center}
.win h2{font-size:26px}
.verse{font-family:var(--display);font-size:22px;text-align:center;line-height:1.2}
.lyrics p{font-size:18px;line-height:1.5;text-align:center}
.lyrics h3{font-size:16px;color:var(--coral);text-align:center;margin:14px 0 4px}

/* entrada */
.gate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:28px 20px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(var(--sky),var(--sky2) 55%,var(--cream) 55%)}
.gate .brand{display:flex;flex-direction:column;align-items:center;gap:4px}
.gate .brand img{width:200px}
.gate form{padding:20px;display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:26px;text-align:center}
label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px}
input{height:52px;border-radius:14px;border:2px solid var(--ink);padding:0 14px;font-size:17px;font-weight:700;background:var(--white);-webkit-user-select:text;user-select:text}
input:focus{outline:3px solid var(--blue);outline-offset:1px}
.err{color:#b3261e;font-size:14px;font-weight:800;min-height:18px}
.fine{font-size:13px;color:var(--ink2);text-align:center;line-height:1.4}

/* folha */
.sheet{position:fixed;inset:0;z-index:9;background:rgba(74,52,38,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:560px;background:var(--cream);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.sheet h2{font-size:22px}
.steps{margin:0;padding-left:22px;line-height:1.6}
/* historinhas (níveis 5 e 6) */
.story{padding:18px;display:flex;flex-direction:column;gap:14px}
.story .ttl{display:flex;align-items:center;gap:12px}
.story .ttl img{width:76px;height:76px;object-fit:contain;flex:none}
.story .ttl h2{font-size:24px}
.story .txt{font-family:var(--display);font-size:25px;line-height:1.5;font-weight:600}
.story .txt span{border-radius:8px;padding:0 2px;cursor:pointer}
.story .txt span.on{background:var(--sun)}
.quiz{display:flex;flex-direction:column;gap:10px;padding:16px}
.quiz h3{font-size:21px;text-align:center}
.opt{min-height:54px;border-radius:16px;border:2px solid var(--ink);background:var(--white);font-family:var(--display);font-size:20px;box-shadow:0 3px 0 var(--ink)}
.opt.ok{background:#bfe6ad}
.opt.no{background:#f9c9c9;animation:shake .3s}
/* livrinho */
.lv-pg{position:relative;background:var(--white);border:2px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.lv-art{display:block;width:100%;height:auto;border-bottom:2px solid var(--ink)}
.lv-txt{padding:14px 16px 20px;font-size:19px;line-height:1.45}
.lv-txt h1{font-size:32px}
.lv-pg.capa .lv-txt,.lv-pg.fim .lv-txt{text-align:center}
.lv-txt .vers{font-style:italic;margin-top:8px}
.lv-txt small{font-style:normal;color:var(--ink2)}
.lv-txt .desenho{margin-top:12px;height:110px;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--ink2);font-size:14px}
.lv-n{position:absolute;right:12px;bottom:6px;font-size:12px;color:var(--ink2)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{min-width:52px;height:48px;padding:0 16px;border-radius:14px;border:2px solid var(--ink);background:var(--white);font-weight:800}
.opts button.sel{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--ink)}
.opts button.cor{width:48px;min-width:48px;padding:0}
.avprev{display:flex;justify-content:center;background:var(--sky2);border-radius:16px;padding:8px}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;height:auto}
  #app,.sheet{display:none!important}
  #print{display:block}
  #print .lv-pg,#print .pst{box-shadow:none;break-after:page;page-break-after:always;border-radius:0;border:0}
  #print .lv-art{border:2px solid #4a3426;border-radius:16px}
  #print .lv-txt{font-size:20pt;padding:18px 6px}
  #print .lv-txt h1{font-size:34pt}
  #print .pst{font-family:var(--display)}
  #print .pst img{width:150px;height:150px;object-fit:contain}
  #print .pst h2{font-size:28pt;margin:10px 0 4px}
  #print .pst p{font-size:22pt;line-height:1.6}
  #print .pst .ref{font-size:12pt;color:#7a6657}
  #print .pst .q{margin-top:28px;font-size:16pt}
}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="print" aria-hidden="true"></div>
<script src="data.js"></script>
<script src="historias.js"></script>
<script src="livro.js"></script>
<script>
(function(){
'use strict';
var D=window.BENE, API='https://acbksachtpypwtbgwyxh.supabase.co/functions/v1/bene-lead', ACESSO='https://acbksachtpypwtbgwyxh.supabase.co/functions/v1/bene-acesso';
var app=document.getElementById('app');
var LS={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};
var user=LS.get('bene_user',null), prog=LS.get('bene_prog',{});
function tem(p){return !!(user&&user.produtos&&user.produtos.indexOf(p)>=0);}
function done(k,i){return !!(prog[k]&&prog[k][i]);}
function mark(k,i){prog[k]=prog[k]||{};prog[k][i]=1;LS.set('bene_prog',prog);}
function count(k){return prog[k]?Object.keys(prog[k]).length:0;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function h(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content;}
var SYL=['#f26b6b','#5ba8e8','#5fa84f','#f2ae16'];
var IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16 4l4 4L9 19z"/><path d="M14 6l4 4"/></svg>',
 gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18M12 9v12M12 9c-4 0-5-5-2-5s2 5 2 5zm0 0c4 0 5-5 2-5s-2 5-2 5z"/></svg>',
 print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8V3h10v5M7 17H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-3"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg>',
 down:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>'
};
var ac=null;
function tone(fs,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();fs.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*(d||.11);o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.11)+.08);o.start(t);o.stop(t+(d||.11)+.1);});}catch(e){}}
var good=function(){tone([660,880]);},bad=function(){tone([220],.16);},win=function(){tone([523,659,784,1047],.13);};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- navegação ---------- */
var route={v:'home'}, stack=[];
function go(r,replace){if(!replace)stack.push(route);route=r;render();window.scrollTo(0,0);}
function back(){route=stack.pop()||{v:'home'};render();window.scrollTo(0,0);}
function tab(v){stack=[];route={v:v};render();window.scrollTo(0,0);}
var TABS=[['home','Início',IC.home],['levels','Atividades',IC.pen],['bonus','Bônus',IC.gift],['print','Imprimir',IC.print]];
function shell(title,body,opts){
  opts=opts||{};
  var top=opts.back?'<button class="icon" id="bk" aria-label="Voltar">'+IC.back+'</button><h1>'+esc(title)+'</h1>'
    :'<img src="img/logo.webp" alt="Bené"><h1></h1><button class="icon" id="acct" aria-label="Minha conta">'+esc((user.nome||'?').charAt(0).toUpperCase())+'</button>';
  var nav=opts.back?'':'<nav aria-label="Menu"><div>'+TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(route.v===t[0]?' aria-current="page"':'')+'><span>'+t[2]+'</span>'+t[1]+'</button>';}).join('')+'</div></nav>';
  app.innerHTML='<header class="top">'+top+'</header><main'+(opts.back?' class="full"':'')+'>'+body+'</main>'+nav;
  var b=document.getElementById('bk'); if(b)b.onclick=back;
  var a=document.getElementById('acct'); if(a)a.onclick=account;
  [].forEach.call(app.querySelectorAll('[data-tab]'),function(x){x.onclick=function(){tab(x.dataset.tab);};});
  [].forEach.call(app.querySelectorAll('[data-go]'),function(x){x.onclick=function(){go(JSON.parse(x.dataset.go));};});
}
function goAttr(o){return " data-go='"+JSON.stringify(o).replace(/'/g,'&#39;')+"'";}

/* ---------- entrada ---------- */
function gate(){
  app.innerHTML='<div class="gate"><div class="brand"><img src="img/logo.webp" alt="Bené, a Ovelhinha"></div>'
   +'<form class="card" novalidate><h1>Acesse seu aplicativo</h1><p class="muted" style="text-align:center">Use o mesmo e-mail que você usou no pagamento. O acesso fica liberado neste aparelho.</p>'
   +'<label>Seu nome<input name="nome" autocomplete="name" maxlength="120" required></label>'
   +'<label>E-mail da compra<input name="email" type="email" inputmode="email" autocomplete="email" maxlength="160" required></label>'
   +'<div class="err" role="alert"></div><button class="btn wide">Entrar</button>'
   +'<p class="fine">Ainda não tem o aplicativo? <a href="/comecar/">Conheça o aplicativo da Bené</a>.</p></form></div>';
  var f=app.querySelector('form'), err=f.querySelector('.err');
  f.onsubmit=function(e){
    e.preventDefault();
    var u={nome:f.nome.value.trim(),email:f.email.value.trim().toLowerCase(),whatsapp:'',sent:true,pago:true};
    if(u.nome.length<2){err.textContent='Digite seu nome.';f.nome.focus();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u.email)){err.textContent='Confira o e-mail.';f.email.focus();return;}
    var b=f.querySelector('.btn'); b.disabled=true; b.textContent='Conferindo…'; err.textContent='';
    temCompra(u.email).then(function(j){
      if(j.ok){u.produtos=j.produtos||[];user=u;LS.set('bene_user',u);route={v:'home'};render();return;}
      b.disabled=false;b.textContent='Entrar';
      err.innerHTML='Não encontramos uma compra com este e-mail. Confira se é o mesmo e-mail do pagamento.';
    },function(){b.disabled=false;b.textContent='Entrar';err.textContent='Sem conexão com a internet. Tente de novo.';});
  };
}
function temCompra(email){
  return fetch(ACESSO,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email})})
    .then(function(r){if(!r.ok&&r.status!==400)throw new Error('rede');return r.json();}).then(function(j){return j||{};});
}
/* quem entrou antes da trava: confere uma vez se tem compra */
function conferirAcesso(){
  if(!user)return;
  temCompra(user.email).then(function(j){
    if(j.ok){var antes=JSON.stringify(user.produtos||[]);user.pago=true;user.produtos=j.produtos||[];LS.set('bene_user',user);if(antes!==JSON.stringify(user.produtos))render();}
    else if(!user.pago){user=null;LS.del('bene_user');render();}
  },function(){});
}
function sheet(html){var s=document.createElement('div');s.className='sheet';s.innerHTML='<div role="dialog" aria-modal="true">'+html+'</div>';s.onclick=function(e){if(e.target===s)s.remove();};document.body.appendChild(s);return s;}
function account(){
  var s=sheet('<h2>Minha conta</h2><p><b>'+esc(user.nome)+'</b><br><span class="muted">'+esc(user.email)+'</span></p>'
   +'<button class="btn ghost wide" id="rst">Zerar o progresso das atividades</button><button class="btn ghost wide" id="out">Sair deste aparelho</button><button class="btn wide" id="cls">Fechar</button>');
  s.querySelector('#cls').onclick=function(){s.remove();};
  s.querySelector('#rst').onclick=function(){prog={};LS.set('bene_prog',prog);s.remove();render();};
  s.querySelector('#out').onclick=function(){user=null;LS.del('bene_user');s.remove();render();};
}

/* ---------- instalar ---------- */
var deferred=null, standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(route.v==='home')render();});
window.addEventListener('appinstalled',function(){standalone=true;deferred=null;if(route.v==='home')render();});
function install(){

/* traçado: pintar por dentro das letras; conclui com 80% coberto */
function tracer(box,text,color,onDone){
  var W=900,cv=document.createElement('canvas'),cx,lines=[],size,H,pts=[],cov=0,ink=[],down=false,fin=false;
  function layout(){
    var m=document.createElement('canvas').getContext('2d'), words=text.split(' ');
    function fits(s){m.font='800 '+s+'px "Baloo 2",sans-serif';var out=[],cur='';for(var i=0;i<words.length;i++){var t=cur?cur+' '+words[i]:words[i];if(m.measureText(t).width>W-60&&cur){out.push(cur);cur=words[i];}else cur=t;}out.push(cur);
      for(var k=0;k<out.length;k++)if(m.measureText(out[k]).width>W-60)return null;return out;}
    for(size=text.length<=2?420:230;size>60;size-=6){var o=fits(size);if(o&&o.length<=(text.length>12?3:1)){lines=o;break;}}
    if(!lines.length)lines=[text];
    H=Math.round(lines.length*size*1.0+70); cv.width=W;cv.height=H;cx=cv.getContext('2d');
    var off=document.createElement('canvas');off.width=W;off.height=H;var o=off.getContext('2d');draw(o,'#000',false);
    var d=o.getImageData(0,0,W,H).data;pts=[];for(var y=6;y<H;y+=12)for(var x=6;x<W;x+=12)if(d[(y*W+x)*4+3]>128)pts.push([x,y,0]);
  }
  function draw(c,fill,dots){
    c.font='800 '+size+'px "Baloo 2",sans-serif';c.textAlign='center';c.textBaseline='alphabetic';
    lines.forEach(function(s,i){var y=40+size*.78+i*size*1.0;
      if(dots){c.setLineDash([3,13]);c.lineWidth=5;c.lineCap='round';c.strokeStyle='#4a3426';c.strokeText(s,W/2,y);c.setLineDash([]);}
      else{c.fillStyle=fill;c.fillText(s,W/2,y);}});
  }
  function paint(){
    cx.clearRect(0,0,W,H);draw(cx,'#efe6d8',false);
    cx.globalCompositeOperation='source-atop';cx.strokeStyle=color;cx.lineWidth=74;cx.lineCap='round';cx.lineJoin='round';
    ink.forEach(function(l){cx.beginPath();cx.moveTo(l[0][0],l[0][1]);for(var i=1;i<l.length;i++)cx.lineTo(l[i][0],l[i][1]);if(l.length===1)cx.lineTo(l[0][0]+.1,l[0][1]);cx.stroke();});
    cx.globalCompositeOperation='source-over';draw(cx,null,true);
  }
  function hit(p){for(var i=0;i<pts.length;i++){var q=pts[i];if(!q[2]&&Math.abs(q[0]-p[0])<40&&Math.abs(q[1]-p[1])<40){q[2]=1;cov++;}}
    if(!fin&&cov>=pts.length*.8){fin=true;pts.forEach(function(q){q[2]=1;});ink=[[[0,H/2],[W,H/2]]];cx.lineWidth=H*2;paintAll();onDone();}}
  function paintAll(){cx.clearRect(0,0,W,H);draw(cx,color,false);draw(cx,null,true);}
  function pos(e){var r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
  cv.addEventListener('pointerdown',function(e){if(fin)return;e.preventDefault();down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}var p=pos(e);ink.push([p]);hit(p);if(!fin)paint();});
  cv.addEventListener('pointermove',function(e){if(!down||fin)return;e.preventDefault();var p=pos(e),l=ink[ink.length-1],a=l[l.length-1],n=Math.ceil(Math.hypot(p[0]-a[0],p[1]-a[1])/30);
    for(var i=1;i<=n;i++)hit([a[0]+(p[0]-a[0])*i/n,a[1]+(p[1]-a[1])*i/n]);l.push(p);if(!fin)paint();});
  ['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(){down=false;});});
  cv.setAttribute('role','img');cv.setAttribute('aria-label','Palavra pontilhada para cobrir com o dedo: '+text);
  box.appendChild(cv);
  function start(){layout();paint();}
  if(document.fonts&&document.fonts.load)document.fonts.load('800 100px "Baloo 2"').then(start,start);else start();
  return {reset:function(){ink=[];cov=0;fin=false;pts.forEach(function(q){q[2]=0;});paint();}};
}

function livroForm(completo,c){

  function grupo(rot,k,vals,cores){return '<label>'+rot+'</label><div class="opts" data-k="'+k+'">'+vals.map(function(v,i){var val=cores?i:v[0];return '<button type="button" class="'+(cores?'cor':'')+(String(c[k])===String(val)?' sel':'')+'" data-v="'+val+'"'+(cores?' style="background:'+v+'" aria-label="'+LV.NOMES[k][i]+'"':'')+'>'+(cores?'':v[1])+'</button>';}).join('')+'</div>';}
  var body='<div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2 style="font-size:22px">'+(completo?'Monte o livrinho':'Qual é o nome do seu filho?')+'</h2>'
    +(completo?'<div class="avprev" id="av"></div>':'')
    +'<label>Nome da criança<input id="nm" maxlength="24" value="'+esc(c.nome)+'" autocomplete="off"></label>'
    +grupo('É menino ou menina?','g',[['m','Menino'],['f','Menina']])
    +(completo?grupo('Cor da pele','pele',LV.PELES,true)+grupo('Cor do cabelo','cab',LV.CABELOS,true)+grupo('Cabelo','tipo',[['liso','Liso'],['cacheado','Cacheado']])+grupo('Cor da roupa','roupa',LV.ROUPAS,true):'')
    +'<div class="err" id="er"></div><button class="btn wide" id="ok">Ver o livrinho</button></div>';
  shell('Livrinho da Bené',body,{back:true});
  function prev(){var a=document.getElementById('av');if(a)a.innerHTML=LV.avatarSvg(c,130);}
  prev();
  [].forEach.call(app.querySelectorAll('.opts'),function(g){[].forEach.call(g.querySelectorAll('button'),function(b){b.onclick=function(){var k=g.dataset.k,v=b.dataset.v;c[k]=(k==='g'||k==='tipo')?v:+v;[].forEach.call(g.querySelectorAll('button'),function(x){x.classList.toggle('sel',x===b);});prev();};});});
  document.getElementById('ok').onclick=function(){
    var n=document.getElementById('nm').value.trim().replace(/\s+/g,' ');
    if(n.length<2){document.getElementById('er').textContent='Digite o nome da criança.';return;}
    c.nome=n.split(' ').map(function(w,i){return i&&/^(de|da|do|dos|das|e)$/i.test(w)?w.toLowerCase():w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');LS.set('bene_livro',c);go({v:'livro'},true);
  };
}
