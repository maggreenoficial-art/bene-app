<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Bem-vinda à turma da Bené</title>
<meta name="theme-color" content="#7EC8F2">
<link rel="icon" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://www.metricasrapida.cloud/t.js" async></script>
<style>
  :root{--ceu:#7EC8F2;--ceu-claro:#EAF6FE;--tinta:#4A3426;--tinta-suave:#6B5546;--sol:#FFC94A;--sol-claro:#FFF4D6;--pasto:#8BD17C;--azul:#5BA8E8;--contorno:3px solid var(--tinta)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);background:var(--ceu);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  h1,h2{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.12;margin:0}
  h1{font-size:clamp(1.9rem,7vw,2.5rem)}
  p{margin:0 0 .8em}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  .bene{width:170px;margin:0 auto -8px;position:relative;z-index:1;display:block}
  .cartao{background:#fff;border:var(--contorno);border-radius:26px;box-shadow:5px 5px 0 var(--tinta);padding:24px 20px;text-align:center}
  .selo{display:inline-block;font-weight:800;border:var(--contorno);border-radius:99px;padding:4px 14px;font-size:.9rem;margin-bottom:10px;background:var(--pasto)}
  .selo.espera{background:var(--sol)}
  .botao{appearance:none;width:100%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.35rem;color:var(--tinta);background:var(--sol);border:var(--contorno);border-radius:18px;box-shadow:5px 5px 0 var(--tinta);padding:14px 20px;cursor:pointer;text-decoration:none;margin-top:16px}
  .passos{list-style:none;padding:0;margin:18px 0 0;text-align:left;display:grid;gap:10px}
  .passos li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;font-size:.95rem}
  .passos .n{width:36px;height:36px;border:var(--contorno);border-radius:12px;background:var(--azul);color:#fff;display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800}
  .passos b{display:block}
  .pedido{list-style:none;padding:0;margin:14px 0 0;text-align:left;display:grid;gap:6px}
  .pedido li{background:var(--sol-claro);border:2.5px solid var(--tinta);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.95rem}
  .pedido li::before{content:"✓ ";color:#3a7d2e}
  .mini{font-size:.85rem;color:var(--tinta-suave);margin-top:16px}
</style>
</head>
<body>
<main>
  <img class="bene" src="/oferta/img/bene.webp" alt="A ovelhinha Bené comemorando" width="170" height="227">
  <div class="cartao" id="conteudo" aria-live="polite">
    <p>Conferindo o seu pagamento…</p>
  </div>
</main>
<script>
(function () {
  const C = window.BENE_CONFIG;
  const q = new URLSearchParams(location.search);
  const id = q.get("payment_intent") || "";
  const el = document.getElementById("conteudo");
  let lead = {};
  try { lead = JSON.parse(localStorage.getItem("bene_checkout") || "{}"); } catch (e) {}
  let nome = (lead.nome || "").split(" ")[0];
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ACESSO = C.checkoutEndpoint.replace("bene-checkout", "bene-acesso");

  const NOMES = { "app-bene": "Aplicativo da Bené + 5 bônus", kit: "Kit da Bené para imprimir (127 páginas)", niveis56: "Níveis 5 e 6: 30 historinhas", livro: "Livrinho personalizado", livro_nome: "Livrinho com o nome do seu filho" };
  function pago(dados) {
    C.compraConfirmada(id, dados);
    if (dados.nome) nome = dados.nome.split(" ")[0];
    if (dados.email) lead.email = dados.email;
    const prods = (dados.produtos && dados.produtos.length ? dados.produtos : [dados.produto || "app-bene"]).filter(p => NOMES[p]);
    const temLivro = prods.indexOf("livro") >= 0 || prods.indexOf("livro_nome") >= 0;
    const temKit = prods.indexOf("kit") >= 0;
    const baixar = '<a class="botao" href="/pdf/kit-completo.pdf" download style="background:var(--pasto)">Baixar o kit (PDF)</a>';
    if (prods.indexOf("app-bene") < 0) {
      // só o kit
      el.innerHTML = `<span class="selo">Pagamento confirmado</span>
        <h1>${nome ? "Seu kit está pronto, " + esc(nome) + "!" : "Seu kit está pronto!"}</h1>
        <p style="margin-top:10px">Baixe o PDF e imprima a primeira folha do nível 1. Sente 10 minutinhos com seu filho e comece pelo BO-LA.</p>
        ${baixar}
        <ul class="passos">
          <li><span class="n">1</span><span><b>Salve o PDF</b>Guarde no celular ou no computador. Você pode voltar nesta página para baixar de novo.</span></li>
          <li><span class="n">2</span><span><b>Leia o guia da página 2</b>Ele explica os 4 passos de cada folha.</span></li>
          <li><span class="n">3</span><span><b>Uma folha por dia</b>Na ordem, do nível 1 ao 4. No final, o certificado!</span></li>
        </ul>
        <p class="mini">O recibo do pagamento foi enviado para o seu e-mail.</p>`;
      return;
    }
    el.innerHTML = `<span class="selo">Pagamento confirmado</span>
      <h1>${nome ? "Bem-vinda, " + esc(nome) + "!" : "Bem-vinda à turma da Bené!"}</h1>
      <p style="margin-top:10px">O aplicativo da Bené já está liberado. Comece hoje pelo Dia 1, com 10 minutinhos.</p>
      <ul class="pedido">${prods.map(p => "<li>" + NOMES[p] + "</li>").join("")}</ul>
      <a class="botao" href="/">Abrir o aplicativo</a>
      ${temKit ? baixar : ""}
      <ul class="passos">
        <li><span class="n">1</span><span><b>Instale na tela inicial</b>No aplicativo, toque em "Instalar". No iPhone: botão Compartilhar e depois "Adicionar à Tela de Início".</span></li>
        <li><span class="n">2</span><span><b>Entre sempre com o mesmo e-mail</b>${lead.email ? esc(lead.email) : "O e-mail que você usou na compra"}.</span></li>
        <li><span class="n">3</span><span><b>Os PDFs estão na aba Imprimir</b>O kit completo e os bônus, para baixar quando quiser.</span></li>
        ${temLivro ? '<li><span class="n">4</span><span><b>Monte o livrinho</b>Na tela inicial do aplicativo, toque no livrinho e digite o nome do seu filho.</span></li>' : ""}
      </ul>
      <p class="mini">O recibo do pagamento foi enviado para o seu e-mail.</p>`;
  }
  function esperando() {
    el.innerHTML = `<span class="selo espera">Aguardando confirmação</span>
      <h1>Quase lá!</h1>
      <p style="margin-top:10px">Estamos esperando a confirmação do pagamento. No Pix, isso leva poucos segundos depois que você paga no aplicativo do banco. Esta página atualiza sozinha.</p>`;
  }
  function falhou() {
    el.innerHTML = `<span class="selo espera">Pagamento não concluído</span>
      <h1>O pagamento não foi aprovado</h1>
      <p style="margin-top:10px">Nenhum valor foi cobrado. Você pode tentar de novo com outra forma de pagamento.</p>
      <a class="botao" href="/checkout/">Tentar de novo</a>`;
  }

  async function conferir() {
    if (!id) return falhou();
    let tentativas = 0;
    const t = async () => {
      tentativas++;
      let j = {};
      try {
        const r = await fetch(ACESSO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ payment_intent: id }) });
        j = await r.json();
      } catch (e) { j = { status: "aguardando" }; }
      if (j.status === "pago") {
        clearInterval(iv); try { sessionStorage.removeItem("bene_pi"); sessionStorage.removeItem("bene_pi_kit"); } catch (e) {}
        // quem pagou com Pix (ou com redirecionamento) ainda não viu as ofertas de 1 clique
        let viu = false; try { viu = !!localStorage.getItem("bene_ofertas_" + id); } catch (e) {}
        if (!viu) { C.compraConfirmada(id, j); location.replace((j.produto === "kit" ? "/kit-oferta-1/" : "/oferta-1/") + "?pi=" + encodeURIComponent(id)); return; }
        pago(j);
      }
      else if (j.status === "falhou" || j.status === "desconhecido") { clearInterval(iv); falhou(); }
      else { esperando(); if (tentativas > 150) clearInterval(iv); }
    };
    const iv = setInterval(t, 4000);
    t();
  }
  conferir();
})();
</script>
</body>
</html>
